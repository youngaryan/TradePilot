name: secure-v1-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quantops_ci
          POSTGRES_USER: quantops
          POSTGRES_PASSWORD: quantops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantops -d quantops_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[backend]"
      - name: Backend tests
        run: python -m unittest discover -v
      - name: Python dependency check
        run: python -m pip check
      - name: Postgres migration smoke
        env:
          DATABASE_URL: postgresql+psycopg://quantops:quantops@127.0.0.1:5432/quantops_ci
          APP_ENV: development
        run: |
          alembic upgrade head
          python - <<'PY'
          from pairs_trading.platform.persistence import PostgresMetadataStore
          store = PostgresMetadataStore("postgresql+psycopg://quantops:quantops@127.0.0.1:5432/quantops_ci")
          counts = store.counts()
          assert hasattr(counts, "artifacts")
          print({"users": counts.users, "organizations": counts.organizations, "artifacts": counts.artifacts})
          PY
      - name: SAST
        run: |
          python -m pip install bandit
          bandit -q -c bandit.yaml -r pairs_trading -x "**/__pycache__/**" --severity-level medium --confidence-level high
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend E2E
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Accessibility smoke
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173
          npx axe http://127.0.0.1:4173 --exit
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Docker Compose config smoke
        run: docker compose config --quiet
      - name: Docker API build
        run: docker build -f Dockerfile.api -t quantops-api:ci .
      - name: Docker web build
        run: docker build -f Dockerfile.web -t quantops-web:ci .
