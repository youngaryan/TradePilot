name: secure-v1-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[backend]"
      - name: Backend tests
        run: python -m unittest discover -v
      - name: Python dependency check
        run: python -m pip check
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Docker API build
        run: docker build -f Dockerfile.api -t quantops-api:ci .
      - name: Docker web build
        run: docker build -f Dockerfile.web -t quantops-web:ci .
