services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quantops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantops -d quantops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    image: 918arad918/pairs_trading-api:latest
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://quantops:${POSTGRES_PASSWORD}@postgres:5432/quantops
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: quantops-artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      COOKIE_SECURE: "false"
      ENABLE_DEMO_ACCOUNTS: "true"
      ENABLE_IN_PROCESS_JOBS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts

  worker:
    image: 918arad918/pairs_trading-api:latest
    command: ["sh", "-c", "alembic upgrade head && python -m apps.worker.rq_worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://quantops:${POSTGRES_PASSWORD}@postgres:5432/quantops
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: quantops-artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      ENABLE_DEMO_ACCOUNTS: "true"
      ENABLE_IN_PROCESS_JOBS: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts

  web:
    image: 918arad918/pairs_trading-web:latest
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
  artifacts:
