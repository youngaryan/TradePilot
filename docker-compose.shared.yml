services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quantops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantops -d quantops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: quantops-artifacts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    image: 918arad918/pairs_trading-api:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://quantops:${POSTGRES_PASSWORD}@postgres:5432/quantops
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: 918arad918/pairs_trading-api:latest
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://quantops:${POSTGRES_PASSWORD}@postgres:5432/quantops
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: quantops-artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      COOKIE_SECURE: "false"
      ENABLE_DEMO_ACCOUNTS: "true"
      ENABLE_IN_PROCESS_JOBS: "false"
      RUN_DB_MIGRATIONS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: 918arad918/pairs_trading-api:latest
    command: ["python", "-m", "apps.worker.rq_worker"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://quantops:${POSTGRES_PASSWORD}@postgres:5432/quantops
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: quantops-artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      ENABLE_DEMO_ACCOUNTS: "true"
      ENABLE_IN_PROCESS_JOBS: "false"
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-180}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.rq_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  job-control:
    image: 918arad918/pairs_trading-api:latest
    command: ["python", "-m", "apps.worker.job_control"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://quantops:${POSTGRES_PASSWORD}@postgres:5432/quantops
      REDIS_URL: redis://redis:6379/0
      ENABLE_DEMO_ACCOUNTS: "true"
      ENABLE_IN_PROCESS_JOBS: "false"
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-180}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
      JOB_RECOVERY_POLL_SECONDS: ${JOB_RECOVERY_POLL_SECONDS:-20}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RECOVERY_BATCH_SIZE: ${JOB_RECOVERY_BATCH_SIZE:-100}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.job_control", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: 918arad918/pairs_trading-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  artifacts:
