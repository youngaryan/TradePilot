x-durable-environment: &durable-environment
  APP_ENV: production
  ENABLE_DEMO_ACCOUNTS: "false"
  ENABLE_IN_PROCESS_JOBS: "false"
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-180}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
  JOB_RECOVERY_POLL_SECONDS: ${JOB_RECOVERY_POLL_SECONDS:-20}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  JOB_RECOVERY_BATCH_SIZE: ${JOB_RECOVERY_BATCH_SIZE:-100}
  PAIRS_TRADING_MARKET_RESEARCH_DATA_PROVIDER: cached_yahoo
  PAIRS_TRADING_MARKET_RESEARCH_ALLOW_DEMO_FALLBACK: "false"
  LOG_JSON: "true"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_RELEASE: ${APP_RELEASE:?APP_RELEASE is required for telemetry correlation}
  SENTRY_DSN_FILE: /run/secrets/sentry_dsn
  SENTRY_REQUIRED: "true"
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLE_RATE: ${OTEL_TRACES_SAMPLE_RATE:-0.05}
  OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-true}
  OBSERVABILITY_METRICS_TOKEN_FILE: /run/secrets/observability_metrics_token

x-application-environment: &application-environment
  <<: *durable-environment
  APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be the public HTTPS origin}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must contain approved HTTPS origins}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS must contain explicit public hostnames}
  API_HEALTH_HOST: ${API_HEALTH_HOST:?API_HEALTH_HOST must be included in TRUSTED_HOSTS}
  HSTS_ENABLED: "true"
  HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-31536000}
  HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-true}
  HSTS_PRELOAD: ${HSTS_PRELOAD:-false}
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  SESSION_SECRET_FILE: /run/secrets/session_secret
  CSRF_SECRET_FILE: /run/secrets/csrf_secret
  MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
  S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME_FILE: /run/secrets/smtp_username
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
  STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
  STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
  STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:?STRIPE_PRICE_PRO_MONTHLY is required}
  STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
  STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?STRIPE_SUCCESS_URL is required}
  STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?STRIPE_CANCEL_URL is required}
  PAIRS_TRADING_MARKET_RESEARCH_LLM_PROVIDER: ${PAIRS_TRADING_MARKET_RESEARCH_LLM_PROVIDER:?Select openai or anthropic}
  PAIRS_TRADING_MARKET_RESEARCH_LLM_MODEL: ${PAIRS_TRADING_MARKET_RESEARCH_LLM_MODEL:?A hosted model is required}
  PAIRS_TRADING_MARKET_RESEARCH_OPENAI_API_KEY_REF: env:OPENAI_API_KEY
  PAIRS_TRADING_MARKET_RESEARCH_ANTHROPIC_API_KEY_REF: env:ANTHROPIC_API_KEY
  OPENAI_API_KEY_FILE: /run/secrets/market_research_api_key
  ANTHROPIC_API_KEY_FILE: /run/secrets/market_research_api_key
  RUN_DB_MIGRATIONS: "false"
  # Safe only because the API has no published port and Nginx replaces client
  # forwarding headers on the isolated backend network.
  FORWARDED_ALLOW_IPS: "*"
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}

x-core-secrets: &core-secrets
  - database_url
  - redis_url
  - sentry_dsn
  - observability_metrics_token

x-application-secrets: &application-secrets
  - database_url
  - redis_url
  - session_secret
  - csrf_secret
  - mfa_encryption_key
  - s3_access_key_id
  - s3_secret_access_key
  - smtp_username
  - smtp_password
  - stripe_secret_key
  - stripe_webhook_secret
  - market_research_api_key
  - sentry_dsn
  - observability_metrics_token

x-hardened: &hardened
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  restart: unless-stopped
  stop_grace_period: 45s
  networks:
    - backend
    - egress

services:
  migrate:
    image: ${API_IMAGE_REPOSITORY:?API_IMAGE_REPOSITORY is required}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST must be sha256:<64 hex>}
    user: "10001:10001"
    command: ["/app/scripts/run-migrations.sh"]
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    networks:
      - egress
    restart: "no"
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50

  api:
    <<: *hardened
    image: ${API_IMAGE_REPOSITORY:?API_IMAGE_REPOSITORY is required}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST must be sha256:<64 hex>}
    user: "10001:10001"
    environment:
      <<: *application-environment
      PROMETHEUS_MULTIPROC_DIR: /tmp/tradepilot-prometheus
    secrets: *application-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
      - /app/artifacts:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0770
      - /app/data:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0770
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/ready',headers={'Host':os.environ['API_HEALTH_HOST']}); urllib.request.urlopen(r,timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0

  worker:
    <<: *hardened
    image: ${API_IMAGE_REPOSITORY:?API_IMAGE_REPOSITORY is required}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST must be sha256:<64 hex>}
    user: "10001:10001"
    command: ["python", "-m", "apps.worker.rq_worker"]
    environment:
      <<: *application-environment
      OBSERVABILITY_METRICS_PORT: "9101"
    secrets: *application-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=1770
      - /app/artifacts:rw,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=0770
      - /app/data:rw,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=0770
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.rq_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 6g
    cpus: 4.0
    stop_grace_period: 90s

  job-control:
    <<: *hardened
    image: ${API_IMAGE_REPOSITORY:?API_IMAGE_REPOSITORY is required}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST must be sha256:<64 hex>}
    user: "10001:10001"
    command: ["python", "-m", "apps.worker.job_control"]
    environment:
      <<: *durable-environment
      OBSERVABILITY_METRICS_PORT: "9102"
    secrets: *core-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.job_control", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 0.50

  web:
    image: ${WEB_IMAGE_REPOSITORY:?WEB_IMAGE_REPOSITORY is required}@${WEB_IMAGE_DIGEST:?WEB_IMAGE_DIGEST must be sha256:<64 hex>}
    user: "101:101"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:?WEB_PORT is required}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=1770
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0770
      - /var/run:rw,noexec,nosuid,nodev,size=8m,uid=101,gid=101,mode=0770
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - backend
    mem_limit: 256m
    cpus: 0.50

networks:
  edge:
  backend:
    internal: true
  egress:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?DATABASE_URL_SECRET_FILE is required}
  redis_url:
    file: ${REDIS_URL_SECRET_FILE:?REDIS_URL_SECRET_FILE is required}
  session_secret:
    file: ${SESSION_SECRET_FILE:?SESSION_SECRET_FILE is required}
  csrf_secret:
    file: ${CSRF_SECRET_FILE:?CSRF_SECRET_FILE is required}
  mfa_encryption_key:
    file: ${MFA_ENCRYPTION_KEY_FILE:?MFA_ENCRYPTION_KEY_FILE is required}
  s3_access_key_id:
    file: ${S3_ACCESS_KEY_ID_FILE:?S3_ACCESS_KEY_ID_FILE is required}
  s3_secret_access_key:
    file: ${S3_SECRET_ACCESS_KEY_FILE:?S3_SECRET_ACCESS_KEY_FILE is required}
  smtp_username:
    file: ${SMTP_USERNAME_FILE:?SMTP_USERNAME_FILE is required}
  smtp_password:
    file: ${SMTP_PASSWORD_FILE:?SMTP_PASSWORD_FILE is required}
  stripe_secret_key:
    file: ${STRIPE_SECRET_KEY_FILE:?STRIPE_SECRET_KEY_FILE is required}
  stripe_webhook_secret:
    file: ${STRIPE_WEBHOOK_SECRET_FILE:?STRIPE_WEBHOOK_SECRET_FILE is required}
  market_research_api_key:
    file: ${MARKET_RESEARCH_API_KEY_FILE:?MARKET_RESEARCH_API_KEY_FILE is required}
  observability_metrics_token:
    file: ${OBSERVABILITY_METRICS_TOKEN_SECRET_FILE:?OBSERVABILITY_METRICS_TOKEN_SECRET_FILE is required}
  sentry_dsn:
    file: ${SENTRY_DSN_SECRET_FILE:?SENTRY_DSN_SECRET_FILE is required}
