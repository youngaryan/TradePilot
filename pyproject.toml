[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-app"
version = "0.1.0"
description = "Extensible quant research and walk-forward backtesting platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "filelock>=3.16",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "yfinance>=0.2",
]

[project.optional-dependencies]
backend = [
  "alembic>=1.13",
  "boto3>=1.34",
  "cryptography>=43.0",
  "fastapi>=0.115",
  "gunicorn>=22.0",
  "httpx>=0.27",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-sdk>=1.24",
  "psycopg[binary]>=3.1",
  "prometheus-client>=0.21",
  "redis>=5.0",
  "rq>=2.10",
  "sentry-sdk>=2.0",
  "setuptools==83.0.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
  "wheel==0.46.3",
]
# Lightweight local sentiment support. This is intentionally separate from the
# transformer stack so API/worker deployments can opt into VADER without also
# installing PyTorch and model tooling.
sentiment-vader = [
  "nltk>=3.8",
]
# Full local NLP/FinBERT support. Hosted API deployments do not need this extra
# unless they are expected to execute transformer-backed sentiment jobs.
sentiment = [
  "beautifulsoup4>=4.12",
  "datasets>=2.14",
  "huggingface_hub>=0.22",
  "lxml>=5.1",
  "nltk>=3.8",
  "spacy>=3.7",
  "torch>=2.2",
  "transformers>=4.39",
]
test = [
  "bandit>=1.8",
  # VADER is exercised by the unconditional Python test suite. Keep this
  # lightweight dependency here rather than forcing the full sentiment extra.
  "nltk>=3.8",
  "pytest>=8",
  "pip-audit>=2.9",
]

[project.scripts]
pairs-trading = "pairs_trading.apps.cli:main"
quant-worker = "apps.worker.main:main"

[tool.fastapi]
entrypoint = "pairs_trading.backend.app:app"

[tool.pytest.ini_options]
markers = [
  "integration: requires real external infrastructure configured through TEST_POSTGRES_URL and/or TEST_REDIS_URL",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pairs_trading*", "apps*"]
