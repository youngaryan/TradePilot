[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-app"
version = "0.1.0"
description = "Extensible quant research and walk-forward backtesting platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "yfinance>=0.2",
]

[project.optional-dependencies]
backend = [
  "alembic>=1.13",
  "boto3>=1.34",
  "fastapi>=0.115",
  "gunicorn>=22.0",
  "httpx>=0.27",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-sdk>=1.24",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "rq>=1.16",
  "sentry-sdk>=2.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]
sentiment = [
  "huggingface_hub>=0.22",
  "torch>=2.2",
  "transformers>=4.39",
]

[project.scripts]
pairs-trading = "pairs_trading.apps.cli:main"
quant-worker = "apps.worker.main:main"

[tool.fastapi]
entrypoint = "pairs_trading.backend.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pairs_trading*", "apps*"]
